<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body>
    <form action="{{ url_for('data') }}" method="POST">

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <input type="text"
               placeholder="Enter your first name"
               name="first name"><br>

        <input type="text"
               placeholder="Enter your last name"
               name="last name"><br>

        <input type="text"
               placeholder="Enter username"
               name="username"><br>

        <input type="email"
               placeholder="Enter your email"
               name="email"><br>

        <input type="password"
               placeholder="Enter your password"
               name="password"><br>

        <label>Voter</label>
        <input type="radio" name="option" value="voter"><br>

        <label>Admin</label>
        <input type="radio" name="option" value="admin"><br>

        <label>Candidate</label>
        <input type="radio" name="option" value="candidate"><br>

        <button type="submit">Register</button>

    </form>
</body>
</html>
