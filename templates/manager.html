<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Management System</title>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="admin-page">

    <div id="lg1">
        <h2>Welcome, {{ username }}</h2>
        <p>Create a new election</p>

        <form action="{{ url_for('admin') }}" method="POST">

            <input type="text" placeholder="Title of the election" name="title" required>

            <textarea placeholder="Election description" name="des" required></textarea>

            <label>Election start date</label>
            <input type="datetime-local" name="start_date" required>

            <label>Election end date</label>
            <input type="datetime-local" name="end_date" required>

            <h5>Election type</h5>

            <label>Local</label>
            <input type="radio" value="local" name="option" required>

            <label>State</label>
            <input type="radio" value="state" name="option">

            <label>National</label>
            <input type="radio" value="national" name="option">

            <label>Organisational</label>
            <input type="radio" value="org" name="option">

            <label>Eligible regions</label>
            <select name="elg" required>
                <option value="karnataka">Karnataka</option>
                <option value="maharashtra">Maharashtra</option>
                <option value="tamil_nadu">Tamil Nadu</option>
                <option value="all">All</option>
            </select>

            <label>Result date</label>
            <input type="datetime-local" name="result_date" required>

            <button type="submit">Create Election</button>

        </form>
    </div>

</body>
</html>
